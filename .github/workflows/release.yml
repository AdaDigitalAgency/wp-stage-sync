name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26'

      - name: Check tag matches .version
        run: test "${GITHUB_REF_NAME#v}" = "$(cat .version)"

      - name: Write release notes
        run: go run ./cmd/release notes "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          LDFLAGS="-s -w -X main.version=${VERSION}"

          # Linux amd64 (primary target — servers)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o wp-stage-sync_linux_amd64 ./cmd/wp-stage-sync/
          
          # Linux arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o wp-stage-sync_linux_arm64 ./cmd/wp-stage-sync/

      - name: Generate checksums
        run: sha256sum wp-stage-sync_* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            wp-stage-sync_linux_amd64
            wp-stage-sync_linux_arm64
            checksums.txt
